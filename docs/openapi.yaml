openapi: 3.1.0
info:
  title: Сверка HTTP API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Service is accepting requests
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {const: ok}}}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/documents:
    post:
      operationId: uploadDocument
      description: >-
        Normally queues a new extraction for every upload. With reuse=true, the server atomically
        finds or creates the job for a corpus PDF in a single-server deployment.
      parameters:
        - name: reuse
          in: query
          description: >-
            Accepts true or false. With true, the file must be named for its corpus ID, such as D001.pdf.
            A unique existing job is reused when its stored PDF has the same SHA-256 and its extraction mode
            matches the server's current mode. Matching jobs are returned in their current status.
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '202':
          description: Newly queued document or the matching existing document
          headers:
            Location:
              description: URL of the returned document
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '400': {$ref: '#/components/responses/Error'}
        '409':
          description: >-
            reuse_conflict. Multiple jobs share the corpus ID, or the unique job has a different
            extraction mode, a different PDF SHA-256, or a missing PDF.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listDocuments
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - name: corpus_id
          in: query
          description: Exact corpus ID filter. A valid unknown ID returns an empty page. An empty or malformed ID returns invalid_query.
          schema: {$ref: '#/components/schemas/CorpusID'}
      responses:
        '200':
          description: >-
            Most recently uploaded first, breaking ties by document_id descending.
            For a filtered request, corpus_id echoes the exact filter on every page, including empty pages,
            and total counts only matching documents.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Document'}}
                      corpus_id: {$ref: '#/components/schemas/CorpusID'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/documents/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getDocument
      responses:
        '200':
          description: Status and extracted data, if available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentDetail'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/documents/{id}/file:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getDocumentFile
      responses:
        '200': {$ref: '#/components/responses/Pdf'}
        '206': {$ref: '#/components/responses/Pdf'}
        '404': {$ref: '#/components/responses/Error'}
        '416': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/documents/{id}/digest:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getDocumentDigest
      description: Hashes the stored original PDF, including PDFs uploaded before this endpoint was available.
      responses:
        '200':
          description: SHA-256 of the stored PDF
          content:
            application/json:
              schema:
                type: object
                required: [sha256]
                properties:
                  sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/results:
    get:
      operationId: listResults
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/DocumentID'}
        - {name: dataset_id, in: query, schema: {$ref: '#/components/schemas/ID'}}
        - {name: task_id, in: query, schema: {$ref: '#/components/schemas/ID'}}
        - {name: config_id, in: query, schema: {$ref: '#/components/schemas/ID'}}
        - {name: metric_name, in: query, description: Case-insensitive exact match, schema: {type: string, minLength: 1}}
        - {name: has_issues, in: query, schema: {type: boolean}}
        - name: q
          in: query
          description: Case-insensitive substring in publication title, metric, dataset, task or configuration name
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Results ordered by result_id ascending
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - {properties: {items: {type: array, items: {$ref: '#/components/schemas/ResultSummary'}}}}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/results/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getResult
      responses:
        '200':
          description: Metric, related entities, sources and validation issues
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResultDetail'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups:
    get:
      operationId: listComparableGroups
      description: >-
        Groups primary extracted numeric results with matching RAG criteria and extraction mode.
        The first two results represent distinct publications identified by DOI or title.
        A missing DOI is resolved by title when exactly one DOI matches among completed documents of the same extraction mode.
        A result with a missing DOI and an ambiguous title can appear in a group whose first two results establish distinct publications.
      responses:
        '200':
          description: Confirmed comparable groups, ordered by stable group ID
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups: {type: array, items: {$ref: '#/components/schemas/ComparableGroup'}}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/comparisons:
    post:
      operationId: compareResults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [left_result_id, right_result_id]
              properties:
                left_result_id: {$ref: '#/components/schemas/ID'}
                right_result_id: {$ref: '#/components/schemas/ID'}
      responses:
        '200':
          description: Comparability decision for the pair, including criteria that could not be evaluated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Comparison'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/export:
    get:
      operationId: exportData
      parameters:
        - {$ref: '#/components/parameters/DocumentID'}
      responses:
        '200':
          description: Streamed JSON export of a consistent snapshot in document list order, without pagination
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, documents]
                properties:
                  schema_version: {const: '1.0'}
                  documents: {type: array, items: {$ref: '#/components/schemas/DocumentDetail'}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ID'}
    DocumentID:
      name: document_id
      in: query
      schema: {$ref: '#/components/schemas/ID'}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
  responses:
    Error:
      description: Request or server error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Pdf:
      description: Original PDF bytes
      content:
        application/pdf:
          schema: {type: string, format: binary}
  schemas:
    ID: {$ref: './extractor.schema.json#/$defs/ID'}
    CorpusID: {type: string, pattern: '^[DP][0-9]{3}$'}
    Mode:
      enum: [mock, python]
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/Error'}
    Page:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: {type: array}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    Document:
      type: object
      required: [document_id, original_filename, corpus_id, status, extraction_mode, failure, file_url, uploaded_at]
      properties:
        document_id: {$ref: '#/components/schemas/ID'}
        original_filename: {type: string}
        corpus_id: {type: [string, 'null']}
        status: {enum: [queued, processing, completed, failed]}
        extraction_mode: {$ref: '#/components/schemas/Mode'}
        failure:
          anyOf:
            - {$ref: '#/components/schemas/Error'}
            - {type: 'null'}
        file_url: {type: string, format: uri-reference}
        uploaded_at: {type: string, format: date-time}
    DocumentDetail:
      type: object
      required: [document, data]
      properties:
        document: {$ref: '#/components/schemas/Document'}
        data:
          anyOf:
            - {$ref: '#/components/schemas/DocumentData'}
            - {type: 'null'}
    DocumentData:
      type: object
      required: [source_document, publication, configurations, datasets, tasks, experiments, results, evidence, issues]
      properties:
        source_document: {$ref: './extractor.schema.json#/$defs/DocumentExtraction'}
        publication: {$ref: './extractor.schema.json#/$defs/Publication'}
        configurations: {type: array, items: {$ref: './extractor.schema.json#/$defs/Configuration'}}
        datasets: {type: array, items: {$ref: './extractor.schema.json#/$defs/Dataset'}}
        tasks: {type: array, items: {$ref: './extractor.schema.json#/$defs/Task'}}
        experiments: {type: array, items: {$ref: './extractor.schema.json#/$defs/Experiment'}}
        results: {type: array, items: {$ref: '#/components/schemas/ResultSummary'}}
        evidence: {type: array, items: {$ref: './extractor.schema.json#/$defs/Evidence'}}
        issues: {type: array, items: {$ref: '#/components/schemas/Issue'}}
    Issue:
      type: object
      required: [issue_id, check_name, description, severity, result_ids, evidence_ids]
      properties:
        issue_id: {$ref: '#/components/schemas/ID'}
        check_name: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        severity: {enum: [info, warning]}
        result_ids: {type: array, items: {$ref: '#/components/schemas/ID'}}
        evidence_ids: {type: array, items: {$ref: '#/components/schemas/ID'}}
    MeasuredValue:
      type: object
      required: [value, unit]
      properties:
        value: {type: number}
        unit: {type: string, minLength: 1}
    ResultSummary:
      type: object
      required: [document_id, extraction_mode, result, normalized, baseline, dataset_name, task_type, configuration_name, issue_count]
      properties:
        document_id: {$ref: '#/components/schemas/ID'}
        extraction_mode: {$ref: '#/components/schemas/Mode'}
        result: {$ref: './extractor.schema.json#/$defs/Result'}
        normalized:
          anyOf:
            - {$ref: '#/components/schemas/MeasuredValue'}
            - {type: 'null'}
        baseline:
          anyOf:
            - {$ref: '#/components/schemas/MeasuredValue'}
            - {type: 'null'}
        dataset_name: {type: [string, 'null']}
        task_type: {type: [string, 'null']}
        configuration_name: {type: [string, 'null']}
        issue_count: {type: integer, minimum: 0}
    ResultDetail:
      allOf:
        - {$ref: '#/components/schemas/ResultSummary'}
        - type: object
          required: [publication, configuration, dataset, task, experiment, evidence, issues]
          properties:
            publication: {$ref: './extractor.schema.json#/$defs/Publication'}
            configuration:
              anyOf:
                - {$ref: './extractor.schema.json#/$defs/Configuration'}
                - {type: 'null'}
            dataset:
              anyOf:
                - {$ref: './extractor.schema.json#/$defs/Dataset'}
                - {type: 'null'}
            task:
              anyOf:
                - {$ref: './extractor.schema.json#/$defs/Task'}
                - {type: 'null'}
            experiment:
              anyOf:
                - {$ref: './extractor.schema.json#/$defs/Experiment'}
                - {type: 'null'}
            evidence: {type: array, items: {$ref: './extractor.schema.json#/$defs/Evidence'}}
            issues: {type: array, items: {$ref: '#/components/schemas/Issue'}}
    Criterion:
      type: object
      required: [criterion, status, message]
      properties:
        criterion:
          enum: [task, dataset, dataset_version, data_split, metric_definition, metric_k, scale, aggregation, evaluation_protocol]
        status: {enum: [match, mismatch, missing, not_applicable]}
        message: {type: string, minLength: 1}
    GroupResult:
      type: object
      required: [result_id, document_id, publication_id, publication_title, dataset_name, configuration_name, metric_name, raw_value, normalized]
      properties:
        result_id: {$ref: '#/components/schemas/ID'}
        document_id: {$ref: '#/components/schemas/ID'}
        publication_id: {$ref: '#/components/schemas/ID'}
        publication_title: {type: string}
        dataset_name: {type: string}
        configuration_name: {type: string}
        metric_name: {type: string}
        raw_value: {type: string}
        normalized: {$ref: '#/components/schemas/MeasuredValue'}
    ComparableGroup:
      type: object
      required: [group_id, extraction_mode, criteria, results]
      properties:
        group_id: {$ref: '#/components/schemas/ID'}
        extraction_mode: {$ref: '#/components/schemas/Mode'}
        criteria: {type: array, items: {$ref: '#/components/schemas/Criterion'}}
        results: {type: array, minItems: 2, items: {$ref: '#/components/schemas/GroupResult'}}
    Comparison:
      type: object
      required: [left_result_id, right_result_id, left_extraction_mode, right_extraction_mode, status, criteria, numeric]
      properties:
        left_result_id: {$ref: '#/components/schemas/ID'}
        right_result_id: {$ref: '#/components/schemas/ID'}
        left_extraction_mode: {$ref: '#/components/schemas/Mode'}
        right_extraction_mode: {$ref: '#/components/schemas/Mode'}
        status: {enum: [comparable, not_comparable, insufficient_information]}
        criteria: {type: array, items: {$ref: '#/components/schemas/Criterion'}}
        numeric:
          anyOf:
            - type: object
              required: [left_value, right_value, delta, unit, preferred]
              properties:
                left_value: {type: number}
                right_value: {type: number}
                delta: {type: number, description: Right value minus left value}
                unit: {type: string, minLength: 1}
                preferred: {enum: [left, right, tie, 'unknown']}
            - {type: 'null'}
